name: Auto PR to Main

on:
  push:
    branches:
      - "**"
      - "!main"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff lint
        run: ruff check src

      - name: Run Ruff format check
        run: ruff format --check src

      - name: Compile Python sources
        run: python -m compileall src

      - name: Run tests
        run: PYTHONPATH=. pytest

  validate-notebooks:
    name: Validate Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook structure and hygiene
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          suspicious_code_patterns = [
              r"os\.environ\[[\"'][^\"']*(api[_-]?key|token|secret)[^\"']*[\"']\]\s*=\s*[\"'][^\"']+[\"']",
              r"(api[_-]?key|token|secret)\s*=\s*[\"'][^\"']+[\"']",
              r"apikey=[A-Za-z0-9_\-]{8,}",
          ]

          notebook_paths = sorted(Path("notebooks").glob("*.ipynb"))
          if not notebook_paths:
              print("No notebooks found.")
              raise SystemExit(0)

          errors = []

          for notebook_path in notebook_paths:
              with notebook_path.open("r", encoding="utf-8") as fp:
                  notebook = json.load(fp)

              if "cells" not in notebook:
                  errors.append(f"{notebook_path}: missing 'cells' section")
                  continue

              for index, cell in enumerate(notebook["cells"]):
                  outputs = cell.get("outputs", [])
                  if outputs:
                      errors.append(
                          f"{notebook_path}: cell {index} contains outputs. Clear notebook outputs before merge."
                      )

                  if cell.get("cell_type") != "code":
                      continue

                  source = "".join(cell.get("source", []))
                  for pattern in suspicious_code_patterns:
                      if re.search(pattern, source, re.IGNORECASE):
                          errors.append(
                              f"{notebook_path}: cell {index} contains suspicious hardcoded secret-like content"
                          )
                          break

          if errors:
              print("Notebook validation failed:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)

          print("All notebooks passed validation.")

  validate-docs:
    name: Validate Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            docs/**/*.md

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  create-or-update-pr:
    name: Create or Update PR
    runs-on: ubuntu-latest
    needs:
      - validate-code
      - validate-notebooks
      - validate-docs
      - secret-scan
    if: success()

    steps:
      - name: Create or reuse PR to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_CREATOR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace("refs/heads/", "");
            const base = "main";
            try {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${head}`,
                base,
              });

              if (pulls.length > 0) {
                core.info(`PR already exists: #${pulls[0].number}`);
                return;
              }

              const response = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title: `Auto PR: ${head} -> ${base}`,
                body: [
                  "This pull request was created automatically after all branch validations passed.",
                  "",
                  `Source branch: \`${head}\``,
                  `Target branch: \`${base}\``,
                ].join("\n"),
              });

              core.info(`Created PR #${response.data.number}`);
            } catch (error) {
              if (error.status === 403) {
                core.setFailed([
                  "Auto PR creation is blocked by GitHub permissions.",
                  "Either enable 'Allow GitHub Actions to create and approve pull requests' in repository settings,",
                  "or create a repository secret named PR_CREATOR_TOKEN with permission to open pull requests.",
                ].join(" "));
                return;
              }

              throw error;
            }
